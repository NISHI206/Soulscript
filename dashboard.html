<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SoulScript</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <h1 class="dtitle">🌿 SoulScript Dashboard</h1>

    <div class="dashboard">

        <div class="result-box">

            <h2>Emotional Index</h2>

            <span id="emotionalIndex">--</span>%

            <div class="meter-container">
                <div class="meter-fill" id="meter"></div>
            </div>

            <h3>
                Status:
                <span id="emotionalLevel">--</span>
            </h3>

        </div>

        <div class="analysis-section">

            <div>

                <h4>Description</h4>
                <br>

                <p id="description">--</p>

            </div>

            <div>

                <h4>💡 Personalized Suggestions</h4>
                <br>

                <p id="suggestions">--</p>

            </div>

        </div>

        <div class="btn">

            <button id="viewHistoryBtn" class="return-home">
                📊 View History
            </button>

            <button class="return-home" onclick="location.href='index.html'">
                Return Home
            </button>

        </div>

    </div>

    <section id="historySection">

        <h2>📜 Your  History</h2>

        <div id="historyList"></div>

    </section>

    <footer class="footer">

        <div class="footer-content">

            <p>
                ⚠️ Disclaimer: This platform does not replace professional care.
            </p>

            <p>
                © 2025 SoulScript
            </p>

        </div>

    </footer>

    <script src="app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const EI = parseFloat(
                localStorage.getItem("emotionalIndex") || 0
            );

            document.getElementById("emotionalIndex").textContent =
                (EI * 100).toFixed(1);

            const meter = document.getElementById("meter");

            meter.style.width = `${EI * 100}%`;

            if (EI >= 0.75) {

                meter.style.background = "green";

            } else if (EI >= 0.5) {

                meter.style.background = "gold";

            } else if (EI >= 0.25) {

                meter.style.background = "orange";

            } else {

                meter.style.background = "red";
            }

        });

        document.getElementById("viewHistoryBtn")
            .addEventListener("click", async () => {

                document.getElementById("historySection")
                    .style.display = "block";

                const token = localStorage.getItem("token");

                if (!token) {

                    alert("Please login first");

                    return;
                }

                try {

                    const response = await fetch(
                        "http://localhost:5050/api/history/all",
                        {
                            headers: {
                                Authorization: `Bearer ${token}`
                            }
                        }
                    );

                    const entries = await response.json();

                    const list =
                        document.getElementById("historyList");

                    list.innerHTML = "";

                    if (entries.length === 0) {

                        list.innerHTML =
                            "<p>No history found.</p>";

                        return;
                    }

                    entries.forEach(entry => {

                        list.innerHTML += `
                        <div class="history-entry">

                            <h3>
                                ${new Date(
                                    entry.createdAt
                                ).toDateString()}
                            </h3>

                            <p>
                                Mood: ${entry.mood}
                            </p>

                            <p>
                                Energy: ${entry.energy}
                            </p>

                            <p>
                                Emotional Index:
                                ${(entry.score * 100).toFixed(1)}%
                            </p>

                            <p>
                                ${entry.journalEntry}
                            </p>

                        </div>
                    `;
                    });

                } catch (error) {

                    console.log(error);

                    alert("Unable to load history");
                }

            });
    </script>

</body>

</html>
